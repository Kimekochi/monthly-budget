<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<meta name="description" content="Track monthly expenses: income, categories, subscriptions, what's left.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}input,select{font-size:16px}</style>
<title>Monthly Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: two-column — sticky summary "ledger" on the left, category accordions on the right; stacks on phones */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d8dee9;
  --fg:#18202f; --muted:#5d6a80; --accent:#2747d6; --accent-ink:#ffffff;
  --good:#11845b; --bad:#c2352b;
  --c1:#2747d6; --c2:#0e9384; --c3:#d9822b; --c4:#b03fa8; --c5:#5b8c1f; --c6:#d14b6b; --c7:#6a5bd8; --c8:#2c8fc4;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --surface:#171e2d; --surface-2:#1d2537; --line:#2b3549;
  --fg:#e7ebf3; --muted:#93a0b8; --accent:#7f97ff; --accent-ink:#0f1420;
  --good:#3fcf95; --bad:#ff7a6e;
  --c1:#7f97ff; --c2:#3cc6b5; --c3:#f0a556; --c4:#dd77d4; --c5:#97c95a; --c6:#f07a95; --c7:#a397ff; --c8:#5fb8e8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#171e2d; --surface-2:#1d2537; --line:#2b3549;
  --fg:#e7ebf3; --muted:#93a0b8; --accent:#7f97ff; --accent-ink:#0f1420;
  --good:#3fcf95; --bad:#ff7a6e;
  --c1:#7f97ff; --c2:#3cc6b5; --c3:#f0a556; --c4:#dd77d4; --c5:#97c95a; --c6:#f07a95; --c7:#a397ff; --c8:#5fb8e8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:0;background:none}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn-ghost{border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--muted);background:var(--surface)}
.btn-ghost:hover{color:var(--fg);border-color:var(--muted)}

/* Summary */
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px}
@media (max-width:820px){.summary{position:static}}
.income-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.income-row input{font-family:var(--f-num);font-size:20px;font-weight:700}
.big{display:grid;gap:4px}
.big .val{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.big .val.neg{color:var(--bad)} .big .val.pos{color:var(--good)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;width:fit-content}
.status.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.status.warn{background:color-mix(in srgb,var(--c3) 18%,transparent);color:var(--c3)}
.status.over{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pair{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.bar span{height:100%;transition:width .3s}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{text-align:right;color:var(--muted)}

/* Categories */
.main{display:grid;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.note{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cat-h{display:grid;grid-template-columns:6px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px 12px 0;width:100%;text-align:left}
.cat-h .sw{height:28px;border-radius:0 4px 4px 0}
.cat-h .t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-h .cnt{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
.cat-h .sum{font-family:var(--f-num);font-weight:700}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.cat.open .chev{transform:rotate(90deg)}
.cat-b{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:10px;background:var(--surface-2)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 110px 132px 32px;gap:8px;align-items:center}
.item input,.item select{background:var(--surface)}
.item .amt{font-family:var(--f-num);text-align:right}
.x{width:32px;height:32px;border-radius:8px;color:var(--muted);display:grid;place-items:center;font-size:18px}
.x:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.add{display:grid;grid-template-columns:minmax(0,1fr) 110px 132px auto;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
@media (max-width:560px){
  .item{grid-template-columns:minmax(0,1fr) 92px 32px}
  .item select{grid-column:1/3}
  .add{grid-template-columns:minmax(0,1fr) 92px}
  .add select{grid-column:1/2} .add .btn{grid-column:2/3}
}
.tools{display:flex;gap:8px}
.lang{font-weight:700;letter-spacing:.06em;min-width:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.cat-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.del-cat{color:var(--muted);font-size:13px;padding:4px 8px;border-radius:6px}
.del-cat:hover,.del-cat.armed{color:var(--bad)}
.del-cat.armed{background:color-mix(in srgb,var(--bad) 12%,transparent);font-weight:600}
.empty{color:var(--muted);font-size:14px;margin:0}
.newcat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <aside class="summary" aria-label="Monthly summary" data-ta="summary">
    <div style="display:grid;gap:6px">
      <label class="label" for="income" data-t="income">Monthly income</label>
      <div class="income-row">
        <input id="income" class="num" type="number" min="0" step="1" inputmode="decimal">
        <select id="currency" aria-label="Currency">
          <option value="$">$</option><option value="₸">₸</option><option value="₽">₽</option><option value="€">€</option>
        </select>
      </div>
    </div>
    <div class="big">
      <span class="label" data-t="left">Left over</span>
      <span id="left" class="val num"></span>
      <span id="status" class="status"></span>
    </div>
    <div>
      <div class="pair"><span data-t="spent">Expenses</span><b id="spent" class="num"></b></div>
      <div class="pair"><span data-t="share">Share of income</span><b id="share" class="num"></b></div>
      <div class="pair"><span data-t="perday">Daily allowance</span><b id="perday" class="num"></b></div>
      <div class="pair"><span data-t="year">Yearly spending</span><b id="year" class="num"></b></div>
    </div>
    <div style="display:grid;gap:10px">
      <span class="label" data-t="where">Where the money goes</span>
      <div id="bar" class="bar" role="img" aria-label="Category shares"></div>
      <div id="legend" class="legend"></div>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <div>
        <h1 data-t="title">Monthly Budget</h1>
        <p data-t="intro">Open a category and add your own items. Weekly and yearly payments are converted to monthly automatically.</p>
      </div>
      <div class="tools"><button id="collapse" class="btn-ghost" type="button" data-t="collapse">Collapse all</button><button id="lang" class="btn-ghost lang" type="button" aria-label="Switch language">RU</button></div>
    </div>
        <div id="cats" style="display:grid;gap:12px"></div>
    <form id="newcat" class="newcat">
      <input id="newcat-name" data-tp="newcat" placeholder="New category, e.g. Gym" aria-label="New category name" maxlength="40">
      <button class="btn" type="submit" data-t="addcat">Add category</button>
    </form>
  </main>
</div>

<script>
(function(){
const KEY='budget-app-en-v1';
const PER={month:1,week:52/12,year:1/12,day:365/12};
const T={
 en:{title:'Monthly Budget',summary:'Monthly summary',income:'Monthly income',left:'Left over',spent:'Expenses',share:'Share of income',perday:'Daily allowance',year:'Yearly spending',where:'Where the money goes',
  intro:'Open a category and add your own items. Weekly and yearly payments are converted to monthly automatically.',collapse:'Collapse all',newcat:'New category, e.g. Gym',addcat:'Add category',
  over:'Over budget by ',start:'Enter your income to start',almost:'Almost fully allocated',ok:'Within income',none:'No expenses yet',
  item:' item',items:' items',empty:'Nothing here yet. Add the first item below.',itemName:'Item name',amount:'Amount',period:'Period',name:'Name',add:'Add',del:'Delete',
  ofIncome:'% of income',delCat:'Delete category',sure:'Click again to delete',
  per:{month:'per month',week:'per week',day:'per day',year:'per year'},
  cats:{housing:'Housing',food:'Groceries',transport:'Transport',fun:'Entertainment',subs:'Subscriptions',phone:'Phone & internet'},
  presets:{subs:[['Claude Pro',20],['ChatGPT Plus',20],['Spotify',''],['YouTube Premium',''],['Netflix',''],['iCloud+','']],
   phone:[['Mobile plan',''],['Home internet','']],transport:[['Transit pass',''],['Taxi',''],['Fuel','']],
   housing:[['Rent',''],['Utilities','']],food:[['Groceries',''],['Market','']],fun:[['Movies',''],['Cafes & restaurants',''],['Games','']]}},
 ru:{title:'Месячный бюджет',summary:'Итоги месяца',income:'Доход в месяц',left:'Остаётся',spent:'Расходы',share:'Доля от дохода',perday:'В день можно тратить',year:'За год уходит',where:'Куда уходят деньги',
  intro:'Откройте категорию и добавьте свои статьи. Недельные и годовые платежи пересчитываются в месячные автоматически.',collapse:'Свернуть все',newcat:'Новая категория, например «Спорт»',addcat:'Добавить категорию',
  over:'Перерасход на ',start:'Введите доход, чтобы начать',almost:'Почти всё расписано',ok:'В пределах дохода',none:'Пока нет расходов',
  item:' шт.',items:' шт.',empty:'Здесь пока пусто. Добавьте первую статью ниже.',itemName:'Название',amount:'Сумма',period:'Период',name:'Название',add:'Добавить',del:'Удалить',
  ofIncome:'% дохода',delCat:'Удалить категорию',sure:'Нажмите ещё раз, чтобы удалить',
  per:{month:'в месяц',week:'в неделю',day:'в день',year:'в год'},
  cats:{housing:'Жильё',food:'Продукты',transport:'Транспорт',fun:'Развлечения',subs:'Подписки',phone:'Связь и интернет'},
  presets:{subs:[['Claude Pro',20],['ChatGPT Plus',20],['Spotify',''],['YouTube Premium',''],['Netflix',''],['Яндекс Плюс','']],
   phone:[['Мобильная связь',''],['Домашний интернет','']],transport:[['Проездной',''],['Такси',''],['Бензин','']],
   housing:[['Аренда',''],['Коммунальные услуги','']],food:[['Супермаркет',''],['Рынок','']],fun:[['Кино',''],['Кафе и рестораны',''],['Игры','']]}}
};
let uid=Date.now();
const id=()=>'i'+(uid++).toString(36);
function fresh(){
  return {lang:'en',income:0,currency:'$',cats:['housing','food','transport','fun','subs','phone'].map((kind,n)=>({id:id(),kind,color:n+1,open:false,items:[]}))};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.cats))S=fresh();
if(!T[S.lang])S.lang='en';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const L=()=>T[S.lang];
const catName=c=>c.kind&&c.kind!=='custom'&&L().cats[c.kind]?L().cats[c.kind]:c.name;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthly=i=>(+i.amount||0)*(PER[i.period]||1);
const catSum=c=>c.items.reduce((a,i)=>a+monthly(i),0);
function fmt(n){
  const r=Math.round(n*100)/100;
  const s=Math.abs(r).toLocaleString(S.lang==='ru'?'ru-RU':'en-US',{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2});
  return (r<0?'−':'')+(S.currency==='$'||S.currency==='€'?S.currency+s:s+' '+S.currency);
}
const color=n=>`var(--c${((n-1)%8)+1})`;

function renderStatic(){
  const t=L();
  document.documentElement.lang=S.lang;
  document.title=t.title;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t[el.dataset.tp];el.setAttribute('aria-label',t[el.dataset.tp])});
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',t[el.dataset.ta]));
  const b=$('#lang');b.textContent=S.lang==='en'?'RU':'EN';
  b.setAttribute('aria-label',S.lang==='en'?'Переключить на русский':'Switch to English');
}
function renderSummary(){
  const t=L(),inc=+S.income||0;
  const total=S.cats.reduce((a,c)=>a+catSum(c),0);
  const left=inc-total;
  $('#left').textContent=fmt(left);
  $('#left').className='val num '+(left<0?'neg':left>0?'pos':'');
  const pct=inc?total/inc*100:0;
  const st=$('#status');
  if(left<0){st.className='status over';st.textContent=t.over+fmt(-left)}
  else if(!inc&&!total){st.className='status warn';st.textContent=t.start}
  else if(pct>90){st.className='status warn';st.textContent=t.almost}
  else {st.className='status ok';st.textContent=t.ok}
  $('#spent').textContent=fmt(total);
  $('#share').textContent=inc?Math.round(pct)+'%':'—';
  $('#perday').textContent=left>0?fmt(left/30):fmt(0);
  $('#year').textContent=fmt(total*12);
  const base=Math.max(inc,total)||1;
  const rows=S.cats.map(c=>({c,s:catSum(c)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  $('#bar').innerHTML=rows.map(r=>`<span title="${esc(catName(r.c))}" style="width:${r.s/base*100}%;background:${color(r.c.color)}"></span>`).join('');
  $('#legend').innerHTML=rows.length?rows.map(r=>`<div><i style="background:${color(r.c.color)}"></i><span class="nm">${esc(catName(r.c))}</span><span class="num">${fmt(r.s)}</span><span class="pc num">${total?Math.round(r.s/total*100):0}%</span></div>`).join(''):`<p class="empty">${t.none}</p>`;
}

const chev='<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>';
function periodSel(v,attrs){
  const per=L().per;
  return `<select ${attrs}>${Object.keys(per).map(k=>`<option value="${k}"${k===v?' selected':''}>${per[k]}</option>`).join('')}</select>`;
}
function renderCats(){
  const t=L();
  $('#cats').innerHTML=S.cats.map(c=>{
    const s=catSum(c);
    const presets=(t.presets[c.kind]||[]).filter(p=>!c.items.some(i=>i.name===p[0]));
    const n=c.items.length;
    return `<section class="cat${c.open?' open':''}" data-cat="${c.id}">
      <button class="cat-h" type="button" data-act="toggle" aria-expanded="${c.open}">
        <span class="sw" style="background:${color(c.color)}"></span>
        <span class="t">${esc(catName(c))}<span class="cnt">${n?n+(n===1?t.item:t.items):''}</span></span>
        <span class="sum">${fmt(s)}</span>${chev}
      </button>
      ${c.open?`<div class="cat-b">
        ${n?c.items.map(i=>`<div class="item" data-item="${i.id}">
          <input value="${esc(i.name)}" data-f="name" aria-label="${t.name}" maxlength="60">
          <input class="amt" type="number" min="0" step="0.01" inputmode="decimal" value="${i.amount}" data-f="amount" aria-label="${t.amount}">
          ${periodSel(i.period,`data-f="period" aria-label="${t.period}"`)}
          <button class="x" type="button" data-act="del-item" aria-label="${t.del} ${esc(i.name)}">×</button>
        </div>`).join(''):`<p class="empty">${t.empty}</p>`}
        <form class="add" data-act="add">
          <input name="name" placeholder="${t.itemName}" aria-label="${t.itemName}" maxlength="60" required>
          <input name="amount" class="num" type="number" min="0" step="0.01" inputmode="decimal" placeholder="${t.amount}" aria-label="${t.amount}" required>
          ${periodSel('month',`name="period" aria-label="${t.period}"`)}
          <button class="btn" type="submit">${t.add}</button>
        </form>
        ${presets.length?`<div class="chips">${presets.map(p=>`<button class="chip" type="button" data-act="preset" data-n="${esc(p[0])}" data-a="${p[1]}">+ ${esc(p[0])}${p[1]?' · '+fmt(p[1]):''}</button>`).join('')}</div>`:''}
        <div class="cat-foot"><span>${s>0&&+S.income?Math.round(s/S.income*100)+t.ofIncome:''}</span>
          <button class="del-cat" type="button" data-act="del-cat">${t.delCat}</button></div>
      </div>`:''}
    </section>`;
  }).join('');
}
function render(){renderStatic();renderCats();renderSummary();save()}
const catOf=el=>S.cats.find(c=>c.id===el.closest('[data-cat]')?.dataset.cat);

$('#income').value=S.income||'';
$('#income').placeholder='0';
$('#currency').value=S.currency;
$('#income').addEventListener('input',e=>{S.income=e.target.value===''?0:+e.target.value;renderSummary();save()});
$('#currency').addEventListener('change',e=>{S.currency=e.target.value;render()});
$('#collapse').addEventListener('click',()=>{S.cats.forEach(c=>c.open=false);render()});
$('#lang').addEventListener('click',()=>{S.lang=S.lang==='en'?'ru':'en';render()});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='FORM')return;
  const act=b.dataset.act,c=catOf(b);
  if(act==='toggle'){c.open=!c.open;render()}
  else if(act==='del-item'){const iid=b.closest('[data-item]').dataset.item;c.items=c.items.filter(i=>i.id!==iid);render()}
  else if(act==='preset'){
    const f=b.closest('.cat-b').querySelector('form.add');
    f.name.value=b.dataset.n;f.amount.value=b.dataset.a;
    (b.dataset.a?f.querySelector('.btn'):f.amount).focus();
  }
  else if(act==='del-cat'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent=L().sure;setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=L().delCat}},3000);return}
    S.cats=S.cats.filter(x=>x!==c);render();
  }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const c=catOf(e.target);const i=c.items.find(i=>i.id===e.target.closest('[data-item]').dataset.item);
  i[f]=f==='amount'?(e.target.value===''?'':+e.target.value):e.target.value;
  e.target.closest('.cat').querySelector('.cat-h .sum').textContent=fmt(catSum(c));
  renderSummary();save();
});
document.addEventListener('change',e=>{if(e.target.dataset.f==='period')render()});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='newcat'){
    const n=$('#newcat-name').value.trim();if(!n)return;
    const used=S.cats.map(c=>c.color);let col=1;while(used.includes(col)&&col<8)col++;
    if(used.includes(col))col=S.cats.length+1;
    S.cats.forEach(c=>c.open=false);
    S.cats.push({id:id(),kind:'custom',name:n,color:col,open:true,items:[]});
    $('#newcat-name').value='';render();
    document.querySelector(`[data-cat="${S.cats.at(-1).id}"] form.add input`)?.focus();
    return;
  }
  if(f.dataset.act==='add'){
    const c=catOf(f);const name=f.name.value.trim();const amt=+f.amount.value;
    if(!name||!(amt>=0))return;
    c.items.push({id:id(),name,amount:amt,period:f.period.value});render();
    document.querySelector(`[data-cat="${c.id}"] form.add input`)?.focus();
  }
});
render();
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
